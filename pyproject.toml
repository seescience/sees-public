# SPDX-License-Identifier: MIT

[project]
name = "sees-public"
dynamic = ["version"]
authors = [ {name = "Christofanis Skordas", email = "skordasc@uchicago.edu"} ]
maintainers = [ {name = "Christofanis Skordas", email = "skordasc@uchicago.edu"} ]
description = "SEES public site"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = "==3.14.*"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "elasticsearch>=9.5.1",
    "flask>=3.1.3",
    "python-dotenv>=1.2.4",
    "ty>=0.0.90",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]

[project.scripts]
sees-public = "sees_public:main"

[project.urls]
Homepage = "https://github.com/seescience/sees-public"
Issues = "https://github.com/seescience/sees-public/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sees_public"]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
]
line-length = 160
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

