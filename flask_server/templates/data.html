{% extends "layout.html" %}
{% block content %}
<div class="body">
    <div class="table-body">
        <input type="search" id="searchInput" class="table-search-input"
            placeholder="Search">
        <label for="year">Filter by year:</label>
        <select id="year">
            <option value="all">All</option>
            {% for year in years %}
            <option value="{{ year }}">{{ year }}</option>
            {% endfor %}
        </select>
        <button id="prevPage">
            <span aria-hidden="true">&larr;</span> Previous page
        </button>
        <span id="pageInfo">Page 1</span>
        <button id="nextPage">
            Next page <span aria-hidden="true">&rarr;</span>
        </button>
        <label for="num-per-page">Items per page:</label>
        <select id="num-per-page">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
        </select>
        <table class="dataTable" id="dataTable">
            <thead class="table-head">
                <tr>
                    <th data-column="id">
                        ID <span class="sort-arrow"></span>
                    </th>
                    <th data-column="title">
                        Title <span class="sort-arrow"></span>
                    </th>
                    <th data-column="author">
                        PI <span class="sort-arrow"></span>
                    </th>
                    <th data-column="year">
                        Year <span class="sort-arrow"></span>
                    </th>
                </tr>
            </thead>
            <tbody class="table-body" id="deviceTableBody"></tbody>
        </table>
    </div>
</div>
<script>
    const dataFromFlask = {{ data | tojson }};
</script>
{% endblock content %}
