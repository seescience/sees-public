{% extends "layout.html" %}
{% block content %}
<div class="body">
    <div class="table-body">
        <label for="year">Filter by year:</label>
        <select id="year">
            <option value="all">All</option>
            {% for year in years %}
            <option value="{{ year }}">{{ year }}</option>
            {% endfor %}
        </select>
        <li class="page-item{% if not prev_url %} disabled{% endif %}">
            <a class="page-link" href="{{ prev_url }}">
                <span aria-hidden="true">&larr;</span> {{ _('Previous page') }}
            </a>
        </li>
        <li class="page-item{% if not next_url %} disabled{% endif %}">
            <a class="page-link" href="{{ next_url }}">
                {{ _('Next page') }} <span aria-hidden="true">&rarr;</span>
            </a>
        </li>
        <label for="num-per-page">Items per page:</label>
        <select id="num-per-page">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
        </select>
        <table class="dataTable" id="dataTable">
            <thead class="table-head">
                <tr>
                    <th data-column="id">
                        ID <span class="sort-arrow"></span>
                    </th>
                    <th data-column="title">
                        Title <span class="sort-arrow"></span>
                    </th>
                    <th data-column="author">
                        PI <span class="sort-arrow"></span>
                    </th>
                    <th data-column="year">
                        Year <span class="sort-arrow"></span>
                    </th>
                </tr>
            </thead>
            <tbody class="table-body" id="deviceTableBody"></tbody>
        </table>
    </div>
</div>
<script>
    const dataFromFlask = {{ data | tojson }};
</script>
{% endblock content %}
